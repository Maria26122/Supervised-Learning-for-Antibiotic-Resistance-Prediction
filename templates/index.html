<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Evaluation Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .metric-card {
            transition: transform 0.2s;
            cursor: pointer;
        }
        .metric-card:hover {
            transform: translateY(-5px);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-5">Model Evaluation Dashboard</h1>
        
        <div class="row justify-content-center mb-4">
            <div class="col-md-6 text-center">
                <button id="evaluationBtn" class="btn btn-primary btn-lg me-2">Show Model Evaluation</button>
                <button id="attributesBtn" class="btn btn-secondary btn-lg">Show Model Attributes</button>
            </div>
        </div>

        <!-- Model Evaluation Section -->
        <div id="evaluationSection" class="hidden">
            <h2 class="text-center mb-4">Model Evaluation Metrics</h2>
            <div class="row">
                <div class="col-md-3">
                    <div class="card metric-card mb-4">
                        <div class="card-body text-center">
                            <h5 class="card-title">Accuracy</h5>
                            <h2 class="text-primary" id="accuracy">0.95</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card metric-card mb-4">
                        <div class="card-body text-center">
                            <h5 class="card-title">Precision</h5>
                            <h2 class="text-success" id="precision">0.93</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card metric-card mb-4">
                        <div class="card-body text-center">
                            <h5 class="card-title">Recall</h5>
                            <h2 class="text-info" id="recall">0.92</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card metric-card mb-4">
                        <div class="card-body text-center">
                            <h5 class="card-title">F1 Score</h5>
                            <h2 class="text-warning" id="f1Score">0.925</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Model Attributes Section -->
        <div id="attributesSection" class="hidden">
            <h2 class="text-center mb-4">Model Attributes</h2>
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <h5>Model Name</h5>
                            <p id="modelName" class="lead">SampleModel</p>
                        </div>
                        <div class="col-md-4">
                            <h5>Version</h5>
                            <p id="modelVersion" class="lead">1.0</p>
                        </div>
                        <div class="col-md-4">
                            <h5>Description</h5>
                            <p id="modelDescription" class="lead">A sample model for demonstration purposes</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function fetchEvaluation() {
            const response = await fetch('/api/evaluation');
            const data = await response.json();
            document.getElementById('accuracy').textContent = data.accuracy;
            document.getElementById('precision').textContent = data.precision;
            document.getElementById('recall').textContent = data.recall;
            document.getElementById('f1Score').textContent = data.f1_score;
        }

        async function fetchAttributes() {
            const response = await fetch('/api/attributes');
            const data = await response.json();
            document.getElementById('modelName').textContent = data.name;
            document.getElementById('modelVersion').textContent = data.version;
            document.getElementById('modelDescription').textContent = data.description;
        }

        document.getElementById('evaluationBtn').addEventListener('click', async function() {
            document.getElementById('evaluationSection').classList.toggle('hidden');
            document.getElementById('attributesSection').classList.add('hidden');
            if (!document.getElementById('evaluationSection').classList.contains('hidden')) {
                await fetchEvaluation();
            }
        });

        document.getElementById('attributesBtn').addEventListener('click', async function() {
            document.getElementById('attributesSection').classList.toggle('hidden');
            document.getElementById('evaluationSection').classList.add('hidden');
            if (!document.getElementById('attributesSection').classList.contains('hidden')) {
                await fetchAttributes();
            }
        });
    </script>
</body>
</html>
