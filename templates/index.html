<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antibiotic Resistance Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center">Antibiotic Resistance Prediction</h1>
        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <form id="predictForm">
                    <div class="mb-3">
                        <label for="genome_data" class="form-label">Genome Data</label>
                        <input type="text" class="form-control" id="genome_data" name="genome_data" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Predict</button>
                </form>
                <div id="result" class="mt-4"></div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('predictForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const genomeData = document.getElementById('genome_data').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="text-info">Predicting...</div>';
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ genome_data: genomeData })
                });
                const data = await response.json();
                if (data.error) {
                    resultDiv.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-success"><strong>Genome:</strong> ${data.genome}<br><strong>Prediction:</strong> ${data.prediction}</div>`;
                }
            } catch (err) {
                resultDiv.innerHTML = '<div class="alert alert-danger">An error occurred. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
